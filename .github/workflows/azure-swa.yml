name: azure-swa

# Serves carhunterworld.com from Azure Static Web Apps (Free plan).
# Why we leave GitHub Pages: its terms forbid running an online business or SaaS on it, and this
# site sells the paid bot. Pages and SWA both serve main; DNS decides which one people see.
#
# The site is plain prebuilt HTML (python _src/build.py, run by hand or by site-top3 in the bot
# repo), so there is no build here. We copy only the files Jekyll used to publish: no _src/,
# no dot files, no *.md, no CNAME/_config.yml. Pushes from site-top3 come over a deploy key,
# and those do start this workflow (only GITHUB_TOKEN pushes don't).
#
# Secret AZURE_STATIC_WEB_APPS_API_TOKEN = deployment token of the SWA resource. Without it the
# deploy step is skipped, not red.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-swa

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage the public files
        run: |
          mkdir dist
          git ls-files -z | grep -zvE '^(\.|_)|^CNAME$|\.md$' | xargs -0 cp --parents -t dist
          # A missing page here = a dead link in the bot, Meta or TikTok. Fail before upload.
          for f in index.html ru/index.html ka/index.html fa/index.html go/index.html deals.json \
                   privacy.html terms.html data-deletion.html staticwebapp.config.json \
                   tiktokV5cvuaxdX7lHWOcSsOoVUbU1xi2bNapD.txt; do
            test -f "dist/$f" || { echo "::error::missing $f"; exit 1; }
          done
          test ! -e dist/_src || { echo "::error::_src must not be public"; exit 1; }
          find dist -type f | sort

      - name: Deploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
