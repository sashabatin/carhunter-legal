<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>CarHunter</title>
<style>
  :root { --bg: #0b1626; --track: #1c2f4a; --ink: #eef2f7; --mute: #9fb0c4; --gold: #f2b84b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  .brand { font-weight: 800; font-size: 30px; letter-spacing: .3px; }
  .brand b { color: var(--gold); }
  .msg { margin: 22px 0 0; font-size: 18px; }
  .site { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .bar { height: 4px; max-width: 220px; margin: 20px auto 24px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--gold); animation: run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
  .alt { margin: 0; color: var(--mute); font-size: 14px; }
  .alt a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="brand">Car<b>Hunter</b></div>
  <p class="msg" id="msg">Opening the listing…</p>
  <div class="bar"><i></i></div>
  <p class="alt" id="alt" hidden><a id="link" href="https://carhunterworld.com/">carhunterworld.com</a></p>
</main>
<script>
// Listing link from a CarHunter deal DM: /go/?<source>-<id>.<user code>[.dev]
// (the first dev cards of 2026-10-18 carry ?c=<code>&l=<source>-<id>&e=dev, still read).
// Shows "opening the listing on myauto.ge", logs the open (bot repo:
// function_app/click_track.py, POST /api/click), then opens the listing. The URL comes from
// these fixed templates, never from the link, so the page cannot send anyone elsewhere.
// Keep T equal to click_track._TEMPLATES (a bot test compares them).
(function () {
  var T = {
    myauto: "https://www.myauto.ge/en/pr/{id}/",
    worldauto: "https://worldauto.ge/ru/sell/all/car/{id}"
  };
  var API = {
    prod: "https://func-carcheckerge-prod-35417.azurewebsites.net/api/click",
    dev: "https://func-carcheckerge-dev-35417.azurewebsites.net/api/click"
  };
  // The bot writes the card in the user's language, but this page cannot know it:
  // the phone's language is the next best guess.
  var TXT = {
    en: ["Opening the listing on {site}…", "Not opening? Tap here"],
    ru: ["Открываем объявление на {site}…", "Не открылось? Нажмите здесь"],
    ka: ["განცხადება იხსნება საიტზე {site}…", "არ გაიხსნა? დააჭირეთ აქ"],
    fa: ["در حال باز کردن آگهی در {site}…", "باز نشد؟ اینجا بزنید"]
  };

  var q = location.search.slice(1);
  var p = new URLSearchParams(q);
  var lid, code, dev;
  if (p.get("l")) {
    lid = p.get("l"); code = p.get("c") || ""; dev = p.get("e") === "dev";
  } else {
    var bits = q.split(".");
    lid = bits[0] || ""; code = bits[1] || ""; dev = bits[2] === "dev";
  }
  var m = /^(myauto|worldauto)-([A-Za-z0-9-]{1,64})$/.exec(lid);
  var dest = m ? T[m[1]].replace("{id}", m[2]) : null;

  if (dest) {
    var site = new URL(dest).hostname.replace(/^www\./, "");
    var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
    var t = TXT[lang] || TXT.en;
    document.documentElement.lang = TXT[lang] ? lang : "en";
    if (lang === "fa") document.documentElement.dir = "rtl";
    document.title = "CarHunter → " + site;
    var around = t[0].split("{site}");
    var msg = document.getElementById("msg");
    var s = document.createElement("span");
    s.className = "site";
    s.textContent = site;
    msg.textContent = around[0];
    msg.appendChild(s);
    msg.appendChild(document.createTextNode(around[1]));
    var link = document.getElementById("link");
    link.href = dest;
    link.textContent = t[1];
    // Only if the browser is still here after a while (a blocked redirect).
    setTimeout(function () { document.getElementById("alt").hidden = false; }, 2500);
  }

  if (dest && /^[a-z2-9]{8}$/.test(code)) {
    // text/plain body: a "simple" cross-origin request, no CORS preflight, and the
    // browser still delivers it while this page is navigating away.
    var api = API[dev ? "dev" : "prod"];
    var body = "c=" + encodeURIComponent(code) + "&l=" + encodeURIComponent(lid);
    var sent = false;
    try { sent = navigator.sendBeacon(api, body); } catch (e) {}
    if (!sent) {
      try { fetch(api, { method: "POST", body: body, mode: "no-cors", keepalive: true }); } catch (e) {}
    }
  }
  location.replace(dest || "https://carhunterworld.com/");
})();
</script>
</body>
</html>
